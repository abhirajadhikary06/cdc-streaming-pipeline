networks:
  cdc-net:
    name: cdc-net
    driver: bridge

volumes:
  kafka_data:
  minio_data:

services:

  kafka:
    image: quay.io/debezium/kafka:3.6
    container_name: cdc-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # client (broker) listener
      - "9093:9093"   # controller listener (KRaft internal, rarely needed from host)
    environment:
      # Any valid 22-char base64 cluster ID works. Generate your own with
      # `docker run --rm quay.io/debezium/kafka:3.6 /kafka/bin/kafka-storage.sh random-uuid`
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      NODE_ID: "1"
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    volumes:
      - kafka_data:/kafka/data
    networks:
      - cdc-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kafka-connect:
    image: quay.io/debezium/connect:3.6
    container_name: cdc-kafka-connect
    hostname: kafka-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: neon-cdc-connect
      CONFIG_STORAGE_TOPIC: neon_cdc_connect_configs
      OFFSET_STORAGE_TOPIC: neon_cdc_connect_offsets
      STATUS_STORAGE_TOPIC: neon_cdc_connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # false -> plain {"before":...,"after":...,"op":...} events, matching
      # the event shape in the spec (section 9). true would nest everything
      # under an extra {"schema":...,"payload":...} envelope.
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    networks:
      - cdc-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: cdc-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
      - kafka-connect
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: neon-cdc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - cdc-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cdc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - cdc-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: cdc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../.env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123} &&
      mc mb -p local/${MINIO_BUCKET:-cdc-lake}/bronze &&
      mc mb -p local/${MINIO_BUCKET:-cdc-lake}/silver &&
      mc mb -p local/${MINIO_BUCKET:-cdc-lake}/checkpoints/bronze &&
      mc mb -p local/${MINIO_BUCKET:-cdc-lake}/checkpoints/silver &&
      exit 0
      "
    networks:
      - cdc-net

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: cdc-streaming-pipeline/spark:3.5.0
    container_name: cdc-spark-master
    hostname: spark-master
    restart: unless-stopped
    command: ["master"]
    ports:
      - "7077:7077"   # Spark master (submit/worker registration)
      - "8080:8080"   # Master web UI
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ../streaming:/opt/spark-apps/streaming
    networks:
      - cdc-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: cdc-streaming-pipeline/spark:3.5.0
    container_name: cdc-spark-worker
    hostname: spark-worker
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"   # Worker web UI
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
    env_file:
      - ../.env
    volumes:
      - ../streaming:/opt/spark-apps/streaming
    networks:
      - cdc-net